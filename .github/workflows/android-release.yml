name: Android Release CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Extract Version Info & Prevent Tag Collision
        id: extract_version
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*' app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=\s*' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')
          
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="1"
          fi
          
          # Prevent duplicate tag collisions if re-running or updating existing version
          BASE_TAG="v$VERSION_NAME"
          if git rev-parse -q --verify "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            FINAL_TAG="v${VERSION_NAME}-b${VERSION_CODE}.${{ github.run_number }}"
          else
            FINAL_TAG="$BASE_TAG"
          fi
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "Resolved Version: $VERSION_NAME (Build $VERSION_CODE) -> Tag: $FINAL_TAG"

      - name: Prepare Signing Keystore
        id: prepare_keystore
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/release.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          elif [ -f "${{ github.workspace }}/my-upload-key.jks" ]; then
            echo "Using existing repository my-upload-key.jks..."
            KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          else
            echo "Generating automatic signing key fallback..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=ShopyPulse, OU=Mobile, O=ShopyPulse, L=Algiers, ST=Algiers, C=DZ"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          JAVA_OPTS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false"
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Release APK Artifact
        run: |
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          APK_DEST="ShopyPulse-v${{ env.VERSION_NAME }}.apk"
          
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            echo "Successfully prepared: $APK_DEST"
          else
            echo "ERROR: Release APK not found in app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Shopy Pulse v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          make_latest: true
          body: |
            ### 🚀 Shopy Pulse v${{ env.VERSION_NAME }} Release
            
            **Build Details:**
            - **Release Artifact:** `ShopyPulse-v${{ env.VERSION_NAME }}.apk`
            - **Version Name:** `${{ env.VERSION_NAME }}`
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Trigger Branch:** `${{ github.ref_name }}`
            - **Author / Lead:** Developed by Charfeddine Ka
            
            **Key Features Included:**
            - 🛒 Smart Shopping List with auto-categorization & offline Room DB
            - 🔍 In-store Barcode & QR Code price verification scanner
            - 📊 Total Basket multi-market price comparison
            - ⚡ Supermarket Mode with live budget HUD & real-time progress
            - ⚙️ Settings: Dark/Light Mode, Language switch (Arabic RTL / English LTR), Google Drive backup
            
            #### 📲 Installation & Update Instructions:
            1. Download the `ShopyPulse-v${{ env.VERSION_NAME }}.apk` file attached below.
            2. Open the APK on your Android device.
            3. This release will update directly over your existing installation without losing any shopping lists or data.
          files: ShopyPulse-v${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
